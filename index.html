<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мои сайты">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Мои сайты</title>
<style>
:root{--bg:#0b0d12;--card:rgba(255,255,255,.075);--border:rgba(255,255,255,.11);--text:#f7f8fb;--muted:#969baa;--accent:#4f7cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,rgba(79,124,255,.22),transparent 34%),radial-gradient(circle at 90% 20%,rgba(125,92,255,.18),transparent 30%),var(--bg)}
.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:52px 0 42px}
header{text-align:center;margin-bottom:32px}.logo{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#4f7cff,#7d5cff);font-size:27px;box-shadow:0 14px 40px rgba(79,124,255,.25)}
h1{margin:0;font-size:42px;letter-spacing:-1.7px}.sub{color:var(--muted);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;min-height:142px;padding:22px;border:1px solid var(--border);border-radius:23px;background:var(--card);backdrop-filter:blur(18px);text-decoration:none;color:var(--text);transition:.2s}.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.105)}
.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#fff;color:#145cff;font-weight:900;margin-bottom:17px}.title{font-size:18px;font-weight:700}.url{margin-top:5px;color:var(--muted);font-size:13px}.arrow{position:absolute;right:20px;top:18px;color:#9299a9;font-size:22px}
.add{min-height:142px;border:1px dashed rgba(255,255,255,.22);border-radius:23px;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:transparent}.add:hover{color:var(--text);background:rgba(255,255,255,.04)}.plus{font-size:29px;text-align:center;margin-bottom:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(520px,100%);background:#171a22;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 20px 80px #000}.box h2{margin:0 0 18px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input{width:100%;padding:14px;border-radius:13px;border:1px solid #343946;background:#0e1016;color:white;font-size:16px;outline:none}button{border:0;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}.save{background:#4f7cff;color:white}.cancel{background:#292e39;color:white;margin-left:8px}.actions{margin-top:18px;text-align:right}
@media(max-width:650px){.wrap{padding-top:34px}.grid{grid-template-columns:1fr}h1{font-size:36px}.modal{align-items:flex-end}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="logo">↗</div><h1>Мои сайты</h1><p class="sub">Все нужные сервисы в одном месте</p></header>
<section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal">
<div class="box"><h2>Добавить сайт</h2>
<label>Название</label><input id="name" placeholder="Например, YouTube">
<label>Ссылка</label><input id="url" type="url" placeholder="https://example.com">
<div class="actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="save" onclick="addSite()">Добавить</button></div>
</div></div>
<script>
const key="my-sites-v1";
const defaults=[{name:"ВТБ — личный кабинет",url:"https://online.vtb.ru/",icon:"ВТБ"}];
let sites=JSON.parse(localStorage.getItem(key)||"null")||defaults;
function render(){const g=document.getElementById("grid");g.innerHTML=sites.map((s,i)=>`<a class="card" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span class="arrow">↗</span><div class="icon">${esc(s.icon||s.name.slice(0,2).toUpperCase())}</div><div class="title">${esc(s.name)}</div><div class="url">${esc(s.url.replace(/^https?:\/\//,"").replace(/\/$/,""))}</div></a>`).join("")+`<div class="add" onclick="openModal()"><div><div class="plus">＋</div><div>Добавить сайт</div></div></div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openModal(){modal.classList.add("show");name.focus()}
function closeModal(){modal.classList.remove("show");name.value="";url.value=""}
function addSite(){let n=name.value.trim(),u=url.value.trim();if(!n||!u)return alert("Заполни название и ссылку");if(!/^https?:\/\//i.test(u))u="https://"+u;sites.push({name:n,url:u,icon:n.slice(0,3).toUpperCase()});localStorage.setItem(key,JSON.stringify(sites));render();closeModal()}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
